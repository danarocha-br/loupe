name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The fixture's next.config.ts imports @danarocha/loupe/next from dist.
      - name: Build loupe
        run: pnpm --filter @danarocha/loupe build
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Run the packed bin
        run: scripts/check-packed-bin.sh
      - name: Build the fixture app
        run: pnpm --filter @fixture/app build
      - name: The build has no trace of the dev loader
        run: scripts/check-fixture-build-clean.sh
