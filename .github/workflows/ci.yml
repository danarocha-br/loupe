name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A pull request draws as its base on main does: every @loupe/ui workbench page and the
  # Toolbar's states, recorded on both on this runner and diffed (`pnpm visual`, AGENTS.md).
  # A change that is meant fails here until the PR carries the `visual-change` label.
  visual:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          # The base is `git merge-base HEAD origin/main`.
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm --filter @fixture/visual exec playwright install --with-deps --only-shell chromium
      - name: Visual check
        id: visual
        run: pnpm visual --base origin/main
        continue-on-error: ${{ contains(github.event.pull_request.labels.*.name, 'visual-change') }}
      - name: Report
        if: always()
        # A job summary holds 1MiB; the artifact has the whole report.
        run: test -f .visual/report.md && head -c 900000 .visual/report.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: visual-report
          path: |
            .visual/report.md
            .visual/diff/
          if-no-files-found: ignore
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The fixture's next.config.ts imports @danarocha/loupe/next from dist.
      - name: Build loupe
        run: pnpm --filter @danarocha/loupe build
      # The fixture's Product layer is generated; a source change without a rerun fails here.
      - name: Generated files are up to date
        run: node packages/loupe/dist/bin.js generate --check --out fixture/app/loupe
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Run the packed bin
        run: scripts/check-packed-bin.sh
      - name: Build the fixture app
        run: pnpm --filter @fixture/app build
      - name: The build has no trace of the dev loader
        run: scripts/check-fixture-build-clean.sh
      # After the clean check: it scans .next, which a dev server writes to.
      - name: next dev --webpack anchors call sites
        run: scripts/check-fixture-webpack-anchors.sh
